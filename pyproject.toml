[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salt-neutronics"
version = "1.0.0"
description = "Emulate Shift FLiBe tritium-breeding neutronics results by interpolating a precomputed Monte Carlo table."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ORNL Shift neutronics analysis" }]
keywords = ["neutronics", "tritium", "FLiBe", "fusion", "interpolation", "HPC"]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "h5py>=3.7",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
salt-neutronics = "salt_neutronics.cli:main"

[tool.setuptools]
packages = ["salt_neutronics"]

[tool.setuptools.package-data]
salt_neutronics = []

[tool.pytest.ini_options]
testpaths = ["tests"]
